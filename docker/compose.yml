name: farelah

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: farelah
      POSTGRES_USER: farelah
      POSTGRES_PASSWORD: farelah
    volumes:
      - farelah_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farelah -d farelah"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend-test:
    profiles: ["test"]
    build:
      context: ../backend
      target: test

  backend:
    build:
      context: ../backend
    environment:
      PORT: "8080"
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://farelah:farelah@database:5432/farelah
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  farelah_data:
